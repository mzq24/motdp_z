device:
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
dataloader:
  batch_size: 256
  num_workers: 4
  persistent_workers: true
  pin_memory: false
  prefetch_factor: 2
  shuffle: true
obs_horizon: 4
pred_horizon: 10
action_horizon: 6
n_obs_steps: 4
ema:
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
  update_interval: 10
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 1.0e-05
shape_meta:
  action:
    shape:
    - 2
  obs:
    agent_pos:
      shape:
      - 2
      type: low_dim
    image:
      shape:
      - 3
      - 96
      - 96
      type: rgb
    speed:
      shape:
      - 1
      type: low_dim
    theta:
      shape:
      - 1
      type: low_dim
    target_point:
      shape:
      - 2
      type: low_dim
enable_action_normalization: true
bev_encoder:
  state_dim: 14
policy:
  input_dim: 2
  output_dim: 2
  horizon: 6
  n_obs_steps: 4
  cond_dim: 256
  obs_as_global_cond: true
  n_layer: 8
  n_head: 16
  n_emb: 1024
  p_drop_emb: 0.1
  p_drop_attn: 0.1
  causal_attn: true
  time_as_cond: true
  obs_as_cond: true
  n_cond_layers: 6
  action_horizon: 6
truncated_diffusion:
  num_train_timesteps: 1000
  trunc_timesteps: 10
  train_trunc_timesteps: 20
  num_diffusion_steps: 5
  eta: 0.0
  prediction_type: "sample"
  norm_x_offset: 16.0
  norm_x_range: 92.0
  norm_y_offset: 45.0
  norm_y_range: 88.0 #  Extended range: x=[-16.0, 76.0], y=[-45.0, 43.0]
  # Z-score normalization for delta: (x - mean) / std
  # Based on waypoint delta statistics
  norm_delta_x_mean: 1.84
  norm_delta_x_std: 2.37
  norm_delta_y_mean: -0.07
  norm_delta_y_std: 0.90
  route_loss_weight: 0.6  # Route is equally important (lateral control) as waypoint (longitudinal control)

# ========== Multimodal Anchor Configuration ==========
anchor_path: /home/users/ntu/wh.huang/scratch/z_projects/code/motdp_z/wp_tokens.pkl
num_modes: 32
cls_loss_weight: 0.1
reg_loss_weight: 1.0

training:
  num_epochs: 500
  max_grad_norm: 1.0
  warmup_epochs: 5
  use_lr_scheduler: true
  dataset_path: /home/users/ntu/wh.huang/scratch/z_projects/dataset/pdm_lite/tmp_data
  image_data_root: /home/users/ntu/wh.huang/scratch/z_projects/dataset/pdm_lite
  sample_interval: 1
  lr_final: 1e-7
  validation_freq: 5
  save_freq: 5
  early_stopping_patience: 10
  checkpoint_dir: /home/users/ntu/wh.huang/scratch/z_projects/code/motdp_z/checkpoints/hpc_run
logging:
  use_wandb: true
  wandb_project: carla-diffusion-policy
  run_name: hpc_full_dataset
  checkpoint_dir: /home/users/ntu/wh.huang/scratch/z_projects/code/motdp_z/checkpoints/hpc_run
  save_every: 5
  log_freq: 50
  wandb_entity: m240117_z
  wandb_api_key: bddb5a05a0820c1157702750c9f0ce60bcac2bba
eval:
  num_episodes: 10
  max_steps: 500
  success_threshold: 0.1
  eval_freq: 10
data_augmentation:
  enable: true
  image_noise_std: 0.02
  action_noise_std: 0.01
  random_crop: false
model_optimization:
  use_mixed_precision: true
  gradient_accumulation_steps: 2
  warmup_steps: 500
  lr_scheduler: cosine
