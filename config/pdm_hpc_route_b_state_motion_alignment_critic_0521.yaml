policy_type: anchor_free
abs_stats_path: /workspace1/z_project/dataset/pdm_lite/tmp_data/abs_stats.npz
route_abs_stats_path: /workspace1/z_project/dataset/pdm_lite/tmp_data/route_abs_stats.npz
device:
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
dataloader:
  batch_size: 256
  num_workers: 8
  persistent_workers: true
  pin_memory: false
  prefetch_factor: 2
  train_num_workers: 8
  val_num_workers: 4
  train_persistent_workers: true
  val_persistent_workers: true
  train_prefetch_factor: 2
  val_prefetch_factor: 2
  val_batch_size: 128
  shuffle: true
  use_window_weighted_sampler: true
  use_route_group_sampler: false
  window_sampler_replacement: true
  window_sampler_weights:
    none: 1.0
    merge: 3.0
    junction: 4.0
    borrow: 3.0
  use_semantic_shift_sampler: true
  semantic_shift_window_weight: 4.0
  semantic_shift_phase_weight: 3.0
  semantic_shift_area_weight: 2.0
  semantic_shift_edge_weight: 2.0
  semantic_shift_opportunity_weight: 2.0
  semantic_shift_max_weight: 8.0
obs_horizon: 4
pred_horizon: 10
action_horizon: 6
n_obs_steps: 4
ema:
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
  update_interval: 10
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 5.0e-05
  weight_decay: 0.0001
shape_meta:
  action:
    shape:
    - 2
  obs:
    agent_pos:
      shape:
      - 2
      type: low_dim
    image:
      shape:
      - 3
      - 96
      - 96
      type: rgb
    speed:
      shape:
      - 1
      type: low_dim
    theta:
      shape:
      - 1
      type: low_dim
    target_point:
      shape:
      - 2
      type: low_dim
enable_action_normalization: true
bev_encoder:
  state_dim: 14
policy:
  input_dim: 2
  output_dim: 2
  horizon: 6
  n_obs_steps: 4
  cond_dim: 256
  obs_as_global_cond: true
  n_layer: 4
  n_head: 8
  n_emb: 512
  p_drop_emb: 0.1
  p_drop_attn: 0.1
  causal_attn: true
  time_as_cond: true
  obs_as_cond: true
  n_cond_layers: 6
  action_horizon: 6
  traj_can_attend_route: true
  use_condition_group_dropout: true
