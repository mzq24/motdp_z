  semantic_prev_modulation_scale: 0.2
  semantic_prev_modulation_dropout_prob: 0.5
  use_semantic_state_fusion: false
  semantic_state_fusion_alpha: 0.0
  semantic_state_fusion_warmup_frames: 0
  semantic_state_fusion_update_cache: true
  guidance_scale: 0.0
  stage1_loss_weight: 1.0
  speed_loss_weight: 0.2
  speed_profile_loss_weight: 0.0
  speed_profile_dt: 0.5
  stage1_chase_weight: 1.0
  stage1_meet_weight: 1.0
  stage1_ped_weight: 1.0
  stage1_window_weight: 0.25
  stage1_phase_weight: 0.1
  stage1_conflict_area_weight: 0.15
