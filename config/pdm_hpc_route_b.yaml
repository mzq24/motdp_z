# Route B+: Compositional Energy-Guided Diffusion (anchor-free, single-mode denoising)
# Based on pdm_hpc_new.yaml with Route B+ specific changes

policy_type: anchor_free  # Use AnnealedEnergyGuidancePolicy
anchor_path: dd_baseline/anchors/carla_kmeans_32.npy
global_abs_stats_path: /workspace1/z_project/dataset/pdm_lite/tmp_data/global_abs_stats.npz

device:
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
dataloader:
  batch_size: 128
  num_workers: 4
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 2
  train_num_workers: 4
  val_num_workers: 1
  train_persistent_workers: false
  val_persistent_workers: false
  train_prefetch_factor: 2
  val_prefetch_factor: 1
  val_batch_size: 128
  shuffle: true
obs_horizon: 4
pred_horizon: 10
action_horizon: 6
n_obs_steps: 4
ema:
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
  update_interval: 10
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 5.0e-05
  weight_decay: 1.0e-04
shape_meta:
  action:
    shape:
    - 2
  obs:
    agent_pos:
      shape:
      - 2
      type: low_dim
    image:
      shape:
      - 3
      - 96
      - 96
      type: rgb
    speed:
      shape:
      - 1
      type: low_dim
    theta:
      shape:
      - 1
      type: low_dim
    target_point:
      shape:
      - 2
      type: low_dim
enable_action_normalization: true
bev_encoder:
  state_dim: 14
policy:
  input_dim: 2
  output_dim: 2
  horizon: 6
  n_obs_steps: 4
  cond_dim: 256
  obs_as_global_cond: true
  n_layer: 8
  n_head: 16
  n_emb: 1024
  p_drop_emb: 0.1
  p_drop_attn: 0.1
  causal_attn: true
  time_as_cond: true
  obs_as_cond: true
  n_cond_layers: 6
  action_horizon: 6
  traj_can_attend_route: false

# ========== Route B+: Compositional Energy Guidance ==========
route_b:
  num_samples: 1           # Diffusion denoising: single mode
  num_energy_modes: 32     # Energy head training: use all anchors
  num_inference_steps: 10  # 10-step DDIM
  use_split_forward: true  # Use split ego/energy forwards for MOA refactor
  guidance_scale: 0.1
  # Per-head energy weights (6 heads: front/left/right/pedestrian/offroad/route)
  energy_front_weight: 1.0
  energy_left_weight: 1.0
  energy_right_weight: 1.0
  energy_pedestrian_weight: 1.0
  energy_offroad_weight: 1.0
  energy_route_weight: 1.0
  # Route energy target parameters
  route_energy_margin: 1.0
  route_energy_norm: 5.0
  energy_loss_weight: 1.0
  train_max_timesteps: 1000
  alignment_loss_weight: 0.0  # Disabled for now: shared decoder/energy objectives were unstable
  num_gt_augmentations: 0
  use_safe_anchors: false
  energy_noisy_training: false
  alignment_warmup_epochs: 50
  energy_grad_clip_norm: 1.0

truncated_diffusion:
  num_train_timesteps: 1000
  trunc_timesteps: 100
  train_trunc_timesteps: 100
  num_diffusion_steps: 10
  eta: 0.0
  prediction_type: "sample"
  route_loss_weight: 0.6
  # Normalization: delta z-score (per-step mean/std from delta_stats_path)
  # Old norm params removed — no longer used

num_modes: 32
cls_loss_weight: 0.0  # M=1: no multi-mode classification needed
reg_loss_weight: 8.0

dataset:
  use_per_frame: false
  cache_dir: null

training:
  num_epochs: 500
  max_grad_norm: 1.0
  warmup_epochs: 10
  use_lr_scheduler: true
  dataset_path: /workspace1/z_project/dataset/pdm_lite/tmp_data
  image_data_root: /workspace1/z_project/dataset/pdm_lite
  sample_interval: 1
  lr_final: 1e-7
  validation_freq: 10
  save_freq: 5
  early_stopping_patience: 15
  checkpoint_dir: /workspace1/z_project/code/motdp_z/checkpoints/route_b_annealed_energy/
validation:
  max_batches: 0
logging:
  use_wandb: true
  wandb_project: route_b_annealed_energy
  run_name: route_b_hpc_v1
  checkpoint_dir: /workspace1/z_project/code/motdp_z/checkpoints/route_b_annealed_energy/
  save_every: 5
  log_freq: 50
augmentation:
  gps_noise:
    enabled: false    # GPS noise on target_point/waypoints during training
    sigma: 0.4        # meters, matches complementary filter residual
    probability: 0.8  # fraction of training samples that receive noise
model_optimization:
  use_mixed_precision: true
