# Local training/eval config for Route B independent-state temp-occ (0429).
# Based on the archived 0423 candidate, but uses the upgraded state labels.

policy_type: anchor_free
abs_stats_path: /media/z/data/dataset/pdm_lite_mini/abs_stats.npz
route_abs_stats_path: /media/z/data/dataset/pdm_lite_mini/route_abs_stats.npz

device:
  gpu_ids:
  - 0

dataloader:
  batch_size: 32
  num_workers: 4
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 2
  train_num_workers: 4
  val_num_workers: 1
  train_persistent_workers: false
  val_persistent_workers: false
  train_prefetch_factor: 2
  val_prefetch_factor: 1
  val_batch_size: 32
  shuffle: true

obs_horizon: 4
pred_horizon: 10
action_horizon: 6
n_obs_steps: 4

ema:
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
  update_interval: 10

optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 5.0e-05
  resume_override_lr: 4e-07
  weight_decay: 1.0e-04

shape_meta:
  action:
    shape:
    - 2
  obs:
    agent_pos:
      shape:
      - 2
      type: low_dim
    image:
      shape:
      - 3
      - 96
      - 96
      type: rgb
    speed:
      shape:
      - 1
      type: low_dim
    theta:
      shape:
      - 1
      type: low_dim
    target_point:
      shape:
      - 2
      type: low_dim

enable_action_normalization: true

bev_encoder:
  state_dim: 14

policy:
  input_dim: 2
  output_dim: 2
  horizon: 6
  n_obs_steps: 4
  cond_dim: 256
  obs_as_global_cond: true
  n_layer: 4
  n_head: 8
  n_emb: 512
  p_drop_emb: 0.1
  p_drop_attn: 0.1
  causal_attn: true
  time_as_cond: true
  obs_as_cond: true
  n_cond_layers: 6
  action_horizon: 6
  traj_can_attend_route: true
  use_condition_group_dropout: true

route_b:
  num_samples: 1
  num_inference_steps: 10
  use_split_forward: true
  use_lidar_bev_detail: true
  lidar_history_frames: 4
  train_stage1: true
  use_stage1_state: true
  shared_stage1_training_source: clean
  use_speed_profile_head: true
  use_traj_branch_condition: true
  traj_branch_condition_scale: 2.0
  traj_branch_condition_detach: true
  traj_branch_condition_gt_prob_start: 1.0
  traj_branch_condition_gt_prob_end: 1.0
  traj_branch_condition_gt_decay_epochs: 0
  traj_branch_condition_affinity_scale: 6.0
  traj_branch_condition_borrow_time_scale: 8.0
  traj_branch_condition_boundary_margin_scale: 5.0
  stage1_boundary_norm_scale: 30.0
  use_temporary_occupancy_phase: true
  temporary_occupancy_dim: 13
  temporary_occupancy_loss_weight: 0.25
  go_opportunity_loss_weight: 0.25
  temporary_occupancy_phase_alpha: 0.0
  use_conflict_timing_state: true
  conflict_area_status_loss_weight: 0.25
  conflict_timing_loss_weight: 0.25
  conflict_timing_dist_norm_scale: 30.0
  conflict_timing_time_norm_scale: 10.0
  use_independent_state_consistency_loss: true
  state_consistency_loss_weight: 1.0
  state_consistency_prob: 0.25
  state_consistency_window_weight: 0.01
  state_consistency_phase_weight: 0.005
  state_consistency_boundary_weight: 0.01
  state_consistency_area_weight: 0.05
  state_consistency_tempocc_weight: 0.05
  state_consistency_opportunity_weight: 0.02
  state_consistency_timing_weight: 0.05
  inside_area_go_loss_weight: 0.1
  use_chase_front_following_state: true
  chase_has_lead_loss_weight: 0.05
  chase_speed_max_loss_weight: 0.15
  chase_speed_norm_scale: 30.0
  traj_branch_condition_chase_margin_scale: 5.0
  guidance_scale: 0.0
  stage1_loss_weight: 1.0
  speed_loss_weight: 0.2
  speed_profile_loss_weight: 0.1
  speed_profile_dt: 0.5
  stage1_query_dt: 1.0
  stage1_query_brake_mps2: 6.0
  stage1_query_accel_mps2: 2.5
  stage1_chase_weight: 1.0
  stage1_meet_weight: 1.0
  stage1_ped_weight: 1.0
  stage1_window_weight: 0.25
  stage1_phase_weight: 0.25
  stage1_conflict_area_weight: 0.25
  train_max_timesteps: 1000
  alignment_loss_weight: 0.0
  stage1_noisy_training: false
  alignment_warmup_epochs: 50
  stage1_grad_clip_norm: 1.0
  train_stage1_until_epoch: 70
  train_stage1_after_update_every: 5
  train_speed_head_until_epoch: 70
  train_speed_head_after_update_every: 5

truncated_diffusion:
  num_train_timesteps: 1000
  trunc_timesteps: 1000
  train_trunc_timesteps: 1000
  num_diffusion_steps: 10
  eta: 0.0
  prediction_type: "sample"
  route_loss_weight: 4.0

num_modes: 32
cls_loss_weight: 0.0
reg_loss_weight: 4.0

dataset:
  use_per_frame: false
  feature_suffix: ensemble
  cache_dir: null
  train_filter_bad_routes: false
  val_filter_bad_routes: true
  train_retain_bad_routes_for_energy: true
  val_retain_bad_routes_for_energy: false

training:
  num_epochs: 150
  max_grad_norm: 1.0
  warmup_epochs: 10
  use_lr_scheduler: true
  scheduler_total_epochs: 100
  dataset_path: /media/z/data/dataset/pdm_lite_mini
  image_data_root: /media/z/data/dataset/pdm_lite_mini
  sample_interval: 1
  lr_final: 1e-8
  validation_freq: 5
  save_freq: 5
  max_keep_ckpts: 20
  early_stopping_patience: 15
  checkpoint_dir: /media/z/data/mzq/others/MoT-DP-worktrees/stage1_0423_candidate/checkpoints/route_b_lidar_bev_stage1_tempocc_0429

validation:
  enabled: true
  use_memmap: true
  preload_to_ram: false
  subset_size: 0
  max_batches: 0

logging:
  use_wandb: false
  wandb_project: route_b_lidar_bev
  run_name: route_b_lidar_bev_stage1_tempocc_0429
  checkpoint_dir: /media/z/data/mzq/others/MoT-DP-worktrees/stage1_0423_candidate/checkpoints/route_b_lidar_bev_stage1_tempocc_0429
  save_every: 5
  log_freq: 50

augmentation:
  gps_noise:
    enabled: true
    sigma: 0.15
    probability: 1
    apply_to_route: false

model_optimization:
  use_mixed_precision: true
