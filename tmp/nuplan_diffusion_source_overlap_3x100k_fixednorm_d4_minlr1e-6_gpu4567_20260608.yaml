# Source-overlap diffusion pretrain with Diffusion-Planner fixed normalization.
# Capacity ablation: modestly deeper same-width model, neighbor loss enabled.

train_cache_dirs:
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_singapore/
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_boston/
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_pittsburgh/
max_samples: null
allowed_target_types:
  - stationary_in_traffic
  - starting_straight_traffic_light_intersection_traversal
  - high_magnitude_speed
samples_per_target_type: 100000
repeat_small_target_types: false
sampling_seed: 0
default_target_type_partition_index: 0
norm_stats_path: null
normalization_mode: diffusion_planner_fixed
normalize_observations: true
state_xy_mean: [10.0, 0.0]
state_xy_std: [20.0, 20.0]
observation_scale: 20.0
neighbor_loss_weight: 1.0

hidden_dim: 192
num_heads: 6
encoder_depth: 4
decoder_depth: 4
agent_num: 32
static_objects_num: 5
static_objects_state_dim: 10
lane_num: 30
lane_len: 20
route_num: 10
route_len: 20
time_len: 21
future_len: 80
predicted_neighbor_num: 10

encoder_drop_path_rate: 0.0
decoder_drop_path_rate: 0.1

num_train_timesteps: 1000
num_inference_steps: 10

batch_size: 512
learning_rate: 5.0e-4
final_learning_rate: 1.0e-6
weight_decay: 0.01
train_epochs: 120
warmup_epochs: 5
max_grad_norm: 5.0
use_amp: true
num_workers: 16
prefetch_factor: 8
persistent_workers: true
use_tqdm: true

val_cache_dirs:
  - /workspace2/z_project/exp/nuplan/cache_plantf_val/
val_every_epochs: 5
enable_validation_in_ddp: true
val_batch_size: 64
val_num_batches: 20
val_num_workers: 8
val_prefetch_factor: 4
val_persistent_workers: true
val_task_metrics: true
val_task_num_batches: 10
val_task_metric_types:
  - stationary_in_traffic
  - starting_straight_traffic_light_intersection_traversal
  - high_magnitude_speed

use_ema: true
ema_decay: 0.999
ema_update_interval: 10

checkpoint_dir: /workspace2/z_project/exp/nuplan/nuplan_whitenoise_diffusion_v1/source_overlap_3x100k_fixednorm_d4_final_lr1e-6_gpu4567_20260608/checkpoints/
save_freq: 5
max_keep_ckpts: 3

use_wandb: true
wandb_project: nuplan_diffusion
wandb_run_name: nuplan_whitenoise_source_overlap_3x100k_fixednorm_d4_final_lr1e-6_gpu4567_20260608_bs512_pf8

policy:
  n_obs_steps: 1
