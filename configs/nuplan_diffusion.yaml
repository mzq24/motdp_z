# NuPlan White-Noise Diffusion Config
# =====================================

# Data — PlanTF cache directories (loaded directly, no preprocessing)
cache_dirs:
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_singapore/
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_boston/
  - /workspace2/z_project/exp/nuplan/cache_plantf_train_pittsburgh/
  - /workspace2/z_project/exp/nuplan/cache_plantf_val/
max_samples: null   # set to e.g. 2000 for quick smoke test
norm_stats_path: null  # will compute on first run

# Model dimensions
hidden_dim: 192
num_heads: 6
encoder_depth: 3
decoder_depth: 3
agent_num: 32
static_objects_num: 5
static_objects_state_dim: 10
lane_num: 30
lane_len: 20
route_num: 10
route_len: 20
time_len: 21              # past timesteps (= num_past_poses + 1)
future_len: 80            # future timesteps (8s at 10Hz)
predicted_neighbor_num: 10

# Encoder
encoder_drop_path_rate: 0.0

# Decoder
decoder_drop_path_rate: 0.1

# Diffusion
num_train_timesteps: 1000
num_inference_steps: 10

# Training
batch_size: 64
learning_rate: 5.0e-4
weight_decay: 0.01
train_epochs: 500
warmup_epochs: 5
max_grad_norm: 5.0
use_amp: true
num_workers: 8

# EMA
use_ema: true
ema_decay: 0.999
ema_update_interval: 10

# Checkpoint
checkpoint_dir: ./checkpoints/
save_freq: 20
max_keep_ckpts: 3

# Logging
use_wandb: true
wandb_project: nuplan_diffusion
wandb_run_name: nuplan_whitenoise_v1

# Policy
policy:
  n_obs_steps: 1
